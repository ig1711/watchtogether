[package]
name = "watchtogether"
version = "0.1.0"
edition = "2024"

[build-dependencies]
gl_generator = "0.14.0"

[dependencies]
ab_glyph = "0.2.32"
glutin = "0.32.3"
image = "0.25.8"
interprocess = { version = "2.2.3", features = ["tokio"] }
libmpv2 = "5.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
winit = "0.30.12"
