[package]
name = "watchtogether"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.33.0", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.33.0", default-features = false }
egui_glow = { version = "0.33.0", default-features = false, features = ["winit", "wayland"] }
glow = { version = "0.16.0", default-features = false }
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wayland", "wgl"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "wayland", "wgl"] }
interprocess = { version = "2.2.3", features = ["tokio"] }
libmpv2 = { version = "5.0.1", features = ["render", "build_libmpv"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
